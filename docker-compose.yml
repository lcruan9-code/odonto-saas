# Banco local para desenvolvimento: `npm run db:up`
# Credenciais iguais às do .env.example.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: odonto_saas
    ports:
      - "5432:5432"
    volumes:
      - odonto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d odonto_saas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  odonto_pgdata:
